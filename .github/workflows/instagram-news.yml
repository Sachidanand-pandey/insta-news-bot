name: Instagram News Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '37 20 * * *'   # 2:07 AM IST
    - cron: '37 8 * * *'    # 2:07 PM IST

permissions:
  contents: read

concurrency:
  group: instagram-news
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      BRAND_NAME: Daily News
      STORY_COUNT: '4'
      BOT_TZ: Asia/Kolkata
      STATE_FILE: state/posted.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore posted-news state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: posted-state-${{ github.run_id }}
          restore-keys: posted-state-

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Build project
        run: mvn -B -DskipTests compile

      - name: Run Instagram automation
        run: mvn -B exec:java -Dexec.args=auto

      - name: Save posted-news state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state
          key: posted-state-${{ github.run_id }}

      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-news-images
          path: output/**/*.jpg
          if-no-files-found: ignore
          retention-days: 3
