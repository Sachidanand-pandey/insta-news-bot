
name: Schedule Test

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: read

concurrency:
  group: schedule-test
  cancel-in-progress: false

jobs:
  test-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Show trigger and time
        run: |
          echo "Workflow started successfully"
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "UTC time:"
          date -u
          echo "India time:"
          TZ=Asia/Kolkata date
