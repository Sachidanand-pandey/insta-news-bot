
name: Schedule Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
      timezone: "Asia/Kolkata"

permissions:
  contents: read

jobs:
  test-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "Schedule test started"
          echo "Event: ${{ github.event_name }}"
          echo "Current time in IST:"
          TZ=Asia/Kolkata date
          echo "Current time in UTC:"
          date -u
