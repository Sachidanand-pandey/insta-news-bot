
name: Schedule Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

jobs:
  test-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm trigger
        run: |
          echo "Schedule test started"
          echo "Event: ${{ github.event_name }}"
          date -u
